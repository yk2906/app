name: Build workflow-demo image

on:
  push:
    branches: [main]
    paths:
      - "workflow-demo/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/workflow-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and push to GHCR
        uses: ./.github/actions/docker-build-push-ghcr
        with:
          context: ./workflow-demo
          registry: ${{ env.REGISTRY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
